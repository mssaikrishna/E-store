
<div *ngIf="authService.isLoggedIn()">
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <button class="btn btn-link fs-4 text-decoration-none" appTextColor [routerLink]="['/shop']">My Store</button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <!-- <li class="nav-item">
          <a class="nav-link" [routerLink]="['/']">Products</a>
        </li> -->
        <li class="nav-item" *ngIf="isAdmin()">
          <button class="btn btn-link fs-4 text-decoration-none" appTextColor [routerLink]="['/admin']">Admin Dashboard</button>
        </li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item" *ngIf="!isLoggedIn()">
          <a class="nav-link" [routerLink]="['/login']">Login</a>
        </li>
        <li class="nav-item" *ngIf="!isLoggedIn()">
          <a class="nav-link" [routerLink]="['/signup']">Signup</a>
        </li>
        <div *ngIf="isLoggedIn()" class="d-flex gap-3">
          <app-primary-button
            [label]="cartLabel()"
            (btnClicked)="goToCart()"
          ></app-primary-button>
          <button class="btn btn-outline-danger" (click)="logout()">
            Logout
          </button>
        </div>
      </ul>
    </div>
  </div>
</nav>
</div>
